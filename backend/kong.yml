_format_version: "3.0"

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - X-Internal-Api-Key
      credentials: false
      preflight_continue: false

  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

services:
  - name: drug-catalogue
    url: http://drug_catalogue_service:5001
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
          fault_tolerant: true
          hide_client_headers: false
    routes:
      - name: drug-catalogue-route
        paths:
          - /drug
        strip_path: false

  - name: invoice-service
    url: http://invoice_service:5003
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          fault_tolerant: true
          hide_client_headers: false
    routes:
      - name: invoice-route
        paths:
          - /invoice
        strip_path: false

  - name: payment-service
    url: http://payment_service:5004
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local
          fault_tolerant: true
          hide_client_headers: false
    routes:
      - name: payment-route
        paths:
          - /payments
        strip_path: false

  - name: prescription-service
    url: http://prescription_service:5005
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          fault_tolerant: true
          hide_client_headers: false
    routes:
      - name: prescription-route
        paths:
          - /prescription
        strip_path: false

  - name: prescribe-medicine
    url: http://prescribe_medicine:5007
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local
          fault_tolerant: true
          hide_client_headers: false
    routes:
      - name: prescribe-medicine-route
        paths:
          - /prescribe
        strip_path: false

  - name: make-payment
    url: http://make_payment:5008
    plugins:
      - name: rate-limiting
        config:
          minute: 20
          policy: local
          fault_tolerant: true
          hide_client_headers: false
    routes:
      - name: make-payment-route
        paths:
          - /make_payment
        strip_path: false
