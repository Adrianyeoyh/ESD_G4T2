_format_version: "3.0"

plugins:
  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

services:
  - name: drug-catalogue
    url: http://drug_catalogue_service:5001
    routes:
      - name: drug-catalogue-route
        paths:
          - /drug
        strip_path: false

  - name: invoice-service
    url: http://invoice_service:5003
    routes:
      - name: invoice-route
        paths:
          - /invoice
        strip_path: false

  - name: payment-service
    url: http://payment_service:5004
    routes:
      - name: payment-route
        paths:
          - /payments
        strip_path: false

  - name: prescribe-medicine
    url: http://prescribe_medicine:5007
    routes:
      - name: prescribe-medicine-route
        paths:
          - /prescribe
        strip_path: false

  - name: make-payment
    url: http://make_payment:5008
    routes:
      - name: make-payment-route
        paths:
          - /make_payment
        strip_path: false
