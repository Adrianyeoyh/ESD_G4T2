groups:
  - name: kong_alerts
    rules:
      # Alert: High error rate (>5% of requests returning 5xx)
      - alert: HighErrorRate
        expr: |
          sum(rate(kong_http_requests_total{code=~"5.."}[5m]))
          /
          sum(rate(kong_http_requests_total[5m]))
          > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate"
          description: "More than 5% of requests are returning 5xx errors for the last 2 minutes."

      # Alert: Service down (no requests for 5 minutes)
      - alert: ServiceDown
        expr: |
          up{job="kong"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Kong is unreachable"
          description: "Prometheus cannot scrape Kong metrics — gateway may be down."

      # Alert: High latency (p99 > 2 seconds)
      - alert: HighLatency
        expr: |
          histogram_quantile(0.99, sum(rate(kong_request_latency_ms_bucket[5m])) by (le, service))
          > 2000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High request latency on {{ $labels.service }}"
          description: "p99 latency is above 2 seconds on {{ $labels.service }} for 3 minutes."

      # Alert: High upstream latency (backend slow)
      - alert: HighUpstreamLatency
        expr: |
          histogram_quantile(0.99, sum(rate(kong_upstream_latency_ms_bucket[5m])) by (le, service))
          > 1500
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Upstream slow for {{ $labels.service }}"
          description: "Backend p99 latency is above 1.5s on {{ $labels.service }}."

      # Alert: Upstream health check failures
      - alert: UpstreamUnhealthy
        expr: |
          kong_upstream_target_health{state="unhealthy"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Upstream target unhealthy: {{ $labels.upstream }}"
          description: "{{ $labels.target }} in {{ $labels.upstream }} is unhealthy."
