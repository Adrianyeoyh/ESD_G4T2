apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: clinicflow
  labels:
    app: postgres
type: Opaque
data:
  # base64 encoded values — change these for production
  # echo -n 'clinic' | base64 => Y2xpbmlj
  POSTGRES_USER: Y2xpbmlj
  POSTGRES_PASSWORD: Y2xpbmlj
---
apiVersion: v1
kind: Secret
metadata:
  name: stripe-credentials
  namespace: clinicflow
  labels:
    app: payment-service
type: Opaque
data:
  # placeholder values — replace with real Stripe keys (base64 encoded)
  # echo -n 'sk_test_placeholder' | base64 => c2tfdGVzdF9wbGFjZWhvbGRlcg==
  # echo -n 'whsec_placeholder' | base64 => d2hzZWNfcGxhY2Vob2xkZXI=
  STRIPE_SECRET_KEY: c2tfdGVzdF9wbGFjZWhvbGRlcg==
  STRIPE_WEBHOOK_SECRET: d2hzZWNfcGxhY2Vob2xkZXI=
---
apiVersion: v1
kind: Secret
metadata:
  name: twilio-credentials
  namespace: clinicflow
  labels:
    app: notification-service
type: Opaque
data:
  # placeholder values — replace with real Twilio credentials (base64 encoded)
  # echo -n 'your_sid' | base64 => eW91cl9zaWQ=
  # echo -n 'your_auth_token' | base64 => eW91cl9hdXRoX3Rva2Vu
  # echo -n 'your_twilio_number' | base64 => eW91cl90d2lsaW9fbnVtYmVy
  TWILIO_ACCOUNT_SID: eW91cl9zaWQ=
  TWILIO_AUTH_TOKEN: eW91cl9hdXRoX3Rva2Vu
  TWILIO_PHONE_NUMBER: eW91cl90d2lsaW9fbnVtYmVy
---
apiVersion: v1
kind: Secret
metadata:
  name: internal-api-key
  namespace: clinicflow
type: Opaque
data:
  # echo -n 'changeme-dev-key' | base64 => Y2hhbmdlbWUtZGV2LWtleQ==
  INTERNAL_API_KEY: Y2hhbmdlbWUtZGV2LWtleQ==
