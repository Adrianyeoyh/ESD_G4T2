apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: clinicflow
  labels:
    app: postgres
type: Opaque
data:
  # base64 encoded values — change these for production
  # echo -n 'clinic' | base64 => Y2xpbmlj
  POSTGRES_USER: Y2xpbmlj
  POSTGRES_PASSWORD: Y2xpbmlj
---
apiVersion: v1
kind: Secret
metadata:
  name: stripe-credentials
  namespace: clinicflow
  labels:
    app: payment-service
type: Opaque
data:
  # placeholder values — replace with real Stripe keys (base64 encoded)
  # echo -n 'sk_test_placeholder' | base64 => c2tfdGVzdF9wbGFjZWhvbGRlcg==
  # echo -n 'whsec_placeholder' | base64 => d2hzZWNfcGxhY2Vob2xkZXI=
  STRIPE_SECRET_KEY: c2tfdGVzdF9wbGFjZWhvbGRlcg==
  STRIPE_WEBHOOK_SECRET: d2hzZWNfcGxhY2Vob2xkZXI=
