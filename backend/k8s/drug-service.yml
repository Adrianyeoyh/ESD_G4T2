apiVersion: apps/v1
kind: Deployment
metadata:
  name: drug-service
  namespace: clinicflow
  labels:
    app: drug-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drug-service
  template:
    metadata:
      labels:
        app: drug-service
    spec:
      containers:
        - name: drug-service
          image: backend-drug_service
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          env:
            - name: APP_ENV
              value: docker
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: esd_db
            - name: DB_SCHEMA
              value: drug_schema
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /drug
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /drug
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: drug-service
  namespace: clinicflow
  labels:
    app: drug-service
spec:
  type: ClusterIP
  selector:
    app: drug-service
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: drug-service-hpa
  namespace: clinicflow
  labels:
    app: drug-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: drug-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
