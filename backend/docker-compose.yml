services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: esd-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - esd-net

  postgres:
    image: postgres:16
    container_name: esd-postgres
    env_file:
      - .env.postgres
    environment:
      POSTGRES_DB: esd_db
    ports:
      - "5432:5432"
    volumes:
      - esd_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d esd_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - esd-net

  invoice_service:
    build:
      context: .
      dockerfile: services/invoice_service/Dockerfile
    container_name: invoice_service
    env_file:
      - ./services/invoice_service/.env
    environment:
      APP_ENV: docker
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esd-net
  drug_service:
    build:
      context: .
      dockerfile: services/drug_catalogue_service/Dockerfile
    container_name: drug_service
    env_file:
      - ./services/drug_catalogue_service/.env
    environment:
      APP_ENV: docker
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esd-net

  payment_service:
    build:
      context: .
      dockerfile: services/payment_service/Dockerfile
    container_name: payment_service
    env_file:
      - ./services/payment_service/.env
    environment:
      APP_ENV: docker
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esd-net

  record_service:
    build:
      context: .
      dockerfile: services/clinical_record_service/Dockerfile
    container_name: clinical_record_service
    env_file:
      - ./services/clinical_record_service/.env
    environment:
      APP_ENV: docker
    ports:
      - "5006:5006"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esd-net

  prescribe_medicine:
    build:
      context: .
      dockerfile: composites/prescribe_medicine/Dockerfile
    container_name: prescribe_medicine
    env_file:
      - ./composites/prescribe_medicine/.env
    environment:
      APP_ENV: docker
    ports:
      - "5007:5007"
    depends_on:
      - drug_service
      - invoice_service
      - record_service
    restart: unless-stopped
    networks:
      - esd-net

volumes:
  esd_pgdata:

networks:
  esd-net:
    driver: bridge