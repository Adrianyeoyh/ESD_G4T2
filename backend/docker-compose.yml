services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: esd-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - esd-net

  postgres:
    image: postgres:16
    container_name: esd-postgres
    env_file:
      - .env.postgres
    environment:
      POSTGRES_DB: esd_db
    ports:
      - "5432:5432"
    volumes:
      - esd_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d esd_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - esd-net

  invoice_service:
    build:
      context: .
      dockerfile: services/invoice_service/Dockerfile
    container_name: invoice_service
    env_file:
      - ./services/invoice_service/.env
    environment:
      APP_ENV: docker
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esd-net
  drug_service:
    build:
      context: .
      dockerfile: services/drug_catalogue_service/Dockerfile
    container_name: drug_service
    env_file:
      - ./services/drug_catalogue_service/.env
    environment:
      APP_ENV: docker
    ports:
      - "5081:5001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esd-net

  prescription_service:
    build:
      context: .
      dockerfile: services/prescription_service/Dockerfile
    container_name: prescription_service
    env_file:
      - ./services/prescription_service/.env
    environment:
      APP_ENV: docker
    ports:
      - "5006:5005"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esd-net

  payment_service:
    build:
      context: .
      dockerfile: services/payment_service/Dockerfile
    container_name: payment_service
    env_file:
      - ./services/payment_service/.env
    environment:
      APP_ENV: docker
      BILLING_SERVICE_URL: http://make_payment_service:5005
      INVOICE_SERVICE_URL: http://invoice_service:5003
      MAKE_PAYMENT_SERVICE_URL: http://make_payment_service:5005
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esd-net

  #######################################
  # Composite services
  #######################################
  prescribe_medicine:
    build:
      context: .
      dockerfile: composites/prescribe_medicine/Dockerfile
    env_file:
      - ./composites/prescribe_medicine/.env
    environment:
      APP_ENV: docker
    ports:
      - "5007:5007"
    depends_on:
      - drug_service
      - invoice_service
      - prescription_service
    restart: unless-stopped
    networks:
      - esd-net

  make_payment:
    build:
      context: .
      dockerfile: composites/make_payment/Dockerfile
    container_name: make_payment_service
    environment:
      APP_ENV: docker
      INVOICE_SERVICE_URL: http://invoice_service:5003
      PAYMENT_SERVICE_URL: http://payment_service:5004
      RECORDS_SERVICE_URL: https://personal-iipxahjd.outsystemscloud.com/ClinicalRecordServices/rest/RecordsAPI
      PATIENT_SERVICE_URL: https://personal-wv4mxqur.outsystemscloud.com/PatientService/rest/PatientAPI
      INTERNAL_API_KEY: changeme-dev-key
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASS: guest
      RABBITMQ_QUEUE: notification.payment.success
    ports:
      - "5005:5005"
    depends_on:
      rabbitmq:
        condition: service_healthy
      invoice_service:
        condition: service_started
      payment_service:
        condition: service_started
    restart: unless-stopped
    networks:
      - esd-net

  notification_service:
    build:
      context: .
      dockerfile: services/notification_service/Dockerfile
    container_name: notification_service
    env_file:
      - ./services/notification_service/.env
    environment:
      APP_ENV: docker
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - esd-net

volumes:
  esd_pgdata:

networks:
  esd-net:
    driver: bridge
